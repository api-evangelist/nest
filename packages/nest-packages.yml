    registry: pkg.go.dev
    name: google.golang.org/api/smartdevicemanagement/v1
    url: https://pkg.go.dev/google.golang.org/api/smartdevicemanagement/v1
    install: go get google.golang.org/api/smartdevicemanagement/v1
    official: true
