note: >-
  The Smart Device Management API is a Google discovery-based REST API. Google
  does not ship a Nest-branded SDK; instead the SDM reference directs developers
  to Google's official multi-API client libraries, which support SDM out of the
  discovery document. These are first-party Google libraries (official: true)
  but are generic Google API clients, not Nest-specific.
packages:
