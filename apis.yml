name: Nest
description: >-
  Nest is Google's smart home brand — thermostats, cameras, doorbells, and the
  Nest Hub — originally founded as Nest Labs (a Lightspeed Venture Partners
  portfolio company) and acquired by Google. Developers integrate with authorized
  Nest devices through the Google Nest Device Access program and its Smart Device
  Management (SDM) API, a Google Cloud REST API authorized with Google OAuth 2.0.
  The API lets partner apps list structures, rooms, and devices, read device
  traits (temperature, humidity, camera, doorbell), and execute trait commands,
  with asynchronous device events delivered via Google Cloud Pub/Sub. The legacy
  "Works with Nest" API was retired and superseded by Device Access.
